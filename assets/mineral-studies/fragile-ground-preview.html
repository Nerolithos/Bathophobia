<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>脆弱地面 · 物理验收</title><style>body{margin:0;background:#111e19;color:#d7ddc4;font:14px monospace}header{display:flex;gap:14px;align-items:center;padding:16px 24px}button{background:#263d2d;color:#d9e3c9;border:1px solid #6b8062;padding:9px 14px;cursor:pointer}canvas{display:block;width:min(100%,1100px);margin:auto;image-rendering:pixelated}footer{padding:12px 24px;color:#94ab93}strong{color:#dfbc82}</style><header><b>煤质页岩 / 脆弱风化层</b><button id=step>推进 0.6 秒</button><button id=reset>重置</button><strong id=state></strong></header><canvas id=preview width=960 height=460></canvas><footer>独立物理验收夹具：左侧为煤痕贴图，右侧运行与游戏相同的踩踏、延迟和地形移除逻辑。游戏地图仍由 CA / BFS / A* 生成与验证。</footer><script src="../../src/engine.js"></script><script src="../../src/player-art.js"></script><script src="../../src/player-detail.js"></script><script src="../../src/player-home.js"></script><script src="../../src/player-animation.js"></script><script src="../../src/visuals.js"></script><script>
const E=CaveEngine,A=CaveArt,c=document.querySelector('canvas').getContext('2d'),sceneTop=32*E.H*20;let s,p,w,blocks,dust,sand,time;
function reset(){let tiles=Array.from({length:E.H},()=>new Uint8Array(E.W)),materials=tiles.map(r=>r.slice());for(let y=10;y<16;y++)for(let x=24;x<43;x++){tiles[y][x]=1;materials[y][x]=y===10?7:E.gossanMaterial(x,32*E.H+y,11)}s={id:32,originRow:0,tiles,materials,routeGuard:tiles.map(r=>new Uint8Array(E.W)),water:tiles.map(r=>Array(E.W).fill(null)),ores:[],moss:[],camps:[]};E.populateFragile(s,11);let f=s.fragiles[0];p=E.spawn(f.tx*20+3,f.ty*20-E.PH);p.ground=true;p.ceiling=-1e6;p.face=1;p.w=E.PW;p.h=E.PH;w=E.worldFor(s);blocks=[];sand=[];dust=0;time=0;draw()}
function step(){for(let i=0;i<36;i++){for(let e of E.updateFragile([s],p)){if(e.type==='fragileCollapse'){dust=3.6;blocks.push(...e.blocks.map(b=>({x:b.tx*20,y:b.ty*20-sceneTop,material:b.material,vy:20,age:0})))}}E.step(p,0,false,w);CavePlayerAnimation.update(p,E.DT);dust=Math.max(0,dust-E.DT);time+=E.DT;for(let b of blocks){b.age+=E.DT;b.vy+=680*E.DT;b.y+=b.vy*E.DT;if(b.age>.45&&!b.broken){b.broken=true;for(let k=0;k<6;k++)sand.push({x:b.x+10,y:b.y+10,vx:(k-2.5)*19,vy:-20-k*4,life:.8})}}blocks=blocks.filter(b=>!b.broken);for(let q of sand){q.x+=q.vx*E.DT;q.y+=q.vy*E.DT;q.vy+=300*E.DT;q.life-=E.DT}sand=sand.filter(q=>q.life>0)}draw()}
function draw(){c.globalAlpha=1;c.fillStyle='#211f18';c.fillRect(0,0,960,460);c.font='16px monospace';c.fillStyle='#b9c7a3';c.fillText('煤质页岩：砂石 + 煤炭',40,55);c.fillText('裂纹风化层：踩踏后约 0.5 秒坍塌',465,55);for(let y=10;y<16;y++)for(let x=3;x<17;x++)A.stoneMaterial(c,x*20,y*20,11,E.hash(x,y,11));for(let y=0;y<E.H;y++)for(let x=0;x<E.W;x++)if(s.tiles[y][x])A.stoneMaterial(c,x*20,y*20,s.materials[y][x],E.hash(x,y,11));for(let f of s.fragiles)if(f.state!=='gone')for(let q of f.caps)if(s.tiles[q.ty% E.H][q.tx])A.fragileCrack(c,q.tx*20,q.ty*20-sceneTop,f.state==='warning',time);for(let b of blocks){c.globalAlpha=1-b.age;c.save();A.stoneMaterial(c,b.x,b.y,b.material,.5);c.restore()}c.globalAlpha=1;A.hero(c,p,sceneTop,time,[],40);for(let q of sand){c.globalAlpha=q.life;c.fillStyle='#d4ad76';c.fillRect(q.x,q.y,3,3)}c.globalAlpha=1;if(dust>0){c.fillStyle='#c5975a';c.globalAlpha=Math.min(1,dust/.7)*.3;c.fillRect(0,0,960,460);for(let i=0;i<55;i++){c.globalAlpha=.35;c.fillStyle='#d7b67f';c.fillRect((i*71-time*190+6000)%1000-20,(i*37)%460,3,1)}}c.globalAlpha=1;document.querySelector('#state').textContent='t='+time.toFixed(1)+'s · '+s.fragiles[0].state+' · 风沙 '+dust.toFixed(1)+'s'}
document.querySelector('#step').onclick=step;document.querySelector('#reset').onclick=reset;reset();
</script></html>
