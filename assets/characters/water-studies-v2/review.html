<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bathophobia · 水中动作原画</title><style>body{background:#14251f;color:#d5dfce;font:15px system-ui;max-width:1200px;margin:32px auto;padding:0 20px}h1{font-size:24px}p{color:#a6bbac}.row{display:flex;gap:16px;flex-wrap:wrap}.frame{background-repeat:no-repeat;image-rendering:pixelated;border:1px solid #53695b}.tread{width:164px;height:300px;background-image:url(treading-outfit-variants.png);background-size:400% 200%}.swim{width:256px;height:256px;background-image:url(swimsuit-swim-keyframes.png);background-size:300% 200%}figure{margin:0}figcaption{font-size:12px;margin:6px 0 18px}.reference{height:300px;image-rendering:pixelated}a{color:#accdb7}</style><h1>水中动作差分 · 原画审阅</h1><p>游戏已撤回本轮人物修改。这些是生图模型制作的逐帧原画，尚未替换运行时贴图。</p><h2>原版角色比例参考</h2><img class="reference" src="../idle-studies/idle-b-ash-brown.png"><img class="reference" src="../idle-studies/b-side-right.png"><div id="frames"></div><script>let out=document.querySelector('#frames');for(let [title,kind,count,offset]of [['原裙装 · 静止踩水','tread',4,0],['泳装 · 静止踩水','tread',4,4],['泳装 · 移动游泳','swim',6,0]]){let h=document.createElement('h2');h.textContent=title;out.append(h);let row=document.createElement('div');row.className='row';out.append(row);for(let i=0;i<count;i++){let columns=kind==='tread'?4:3,n=i+offset,figure=document.createElement('figure'),frame=document.createElement('div');frame.className='frame '+kind;frame.style.backgroundPosition=(n%columns)*100/(columns-1)+'% '+(Math.floor(n/columns)*100)+'%';let label=document.createElement('figcaption');label.textContent='帧 '+(i+1);figure.append(frame,label);row.append(figure)}};</script></html>
